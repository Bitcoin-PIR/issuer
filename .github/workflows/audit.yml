name: Security audit

# RustSec advisory scan of Cargo.lock, the fully pinned dependency set the
# issuer and the CLN RPC guard are built from (`cargo build --locked`).
# Same shape as the job in Bitcoin-PIR/Bitcoin-PIR.
#
# Advisory-only by design; do not make it a required check:
#   1. It needs the network to fetch the RustSec advisory database.
#   2. New advisories appear without any code change, so a green commit
#      can turn red overnight. The weekly run is the primary signal; the
#      push/PR runs only catch a Cargo.lock change that introduces an
#      already-known-vulnerable version.

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - '.github/workflows/audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - '.github/workflows/audit.yml'
  workflow_dispatch:
  schedule:
    # Monday 06:41 UTC, staggered from the main repository's 06:23 run.
    - cron: '41 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit (RustSec advisories)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install --profile minimal
      # A fresh install each run, so the advisory-matching engine is current.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Reads Cargo.lock only; no build.
      - name: Run cargo audit
        run: cargo audit
