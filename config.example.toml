# bpir-issuer configuration. Copy to /etc/bitcoinpir/issuer/config.toml.
listen = "127.0.0.1:8095"

# 32-byte Ed25519 issuer seed from `bpir-issuer keygen`: signs every
# POST /v2/redeem answer; PIR servers pin its public key with
# --credit-issuer-pubkey. (The key name predates credits.)
grant_key_path = "/etc/bitcoinpir/issuer/grant.key"
# 64-byte seed from `bpir-issuer wallet-seed`. Back it up: it recovers the ecash.
wallet_seed_path = "/etc/bitcoinpir/issuer/wallet.seed"
wallet_db_path = "/var/lib/bitcoinpir-issuer/wallet.sqlite"
# Append-only audit/idempotency log.
store_path = "/var/lib/bitcoinpir-issuer/grants.jsonl"

# Mints whose ecash is accepted; the browser buys from the first one.
mints = ["https://mint.example"]

# Browser origins allowed by CORS (empty = any origin; no cookies are used).
cors_origins = ["https://www.bitcoinpir.org", "https://bitcoinpir.org"]

# Credits contract (docs/CREDITS.md in the main repository), published in
# GET /v2/info and used to turn redeemed sats into gas. Defaults shown.
[gas]
credit_sat = 10
gas_per_credit = 72000
base_gas_per_frame = 20
egress_gas_per_mb = 1000

# Operator identity keys (64 hex) whose certified PIR servers may call
# POST /v2/redeem. Empty refuses every server.
operator_pubkeys = []
# Tolerated clock difference of a redeem request (seconds).
redeem_max_skew_secs = 300
# Redemption log (replay index + settlement ledger); default: redeem.jsonl next to store_path.
# redeem_store_path = "/var/lib/bitcoinpir-issuer/redeem.jsonl"

# ARC credentials (docs/CREDITS.md): one credential = presentation_limit
# presentations, one credit each. Omit the whole table to sell none.
[arc]
# 32-byte master seed from `bpir-issuer arc-seed`; every epoch's issuer keys
# derive from it. Back it up: it is the credentials.
seed_path = "/etc/bitcoinpir/issuer/arc.seed"
epoch_secs = 7776000        # 90 days; credentials are issued under the current epoch
grace_secs = 2592000        # 30 days after an epoch ends its credentials still spend
presentation_limit = 100
[[arc.credential_offers]]   # credits must equal presentation_limit
credits = 100
sat = 1000

# Worst-case prices shown to clients in GET /v2/info (informational). Defaults shown.
[[rate_card]]
flow = "onion_single_address"
credits = 10
[[rate_card]]
flow = "harmony_fresh_client"
credits = 5
[[rate_card]]
flow = "dpf_single_address"
credits = 2
[[rate_card]]
flow = "oram_single_address"
credits = 1

# x402 `exact/lnbtc` (Lightning) purchase rail for `POST /v2/credentials`.
# Remove the table to keep the endpoint Cashu-only. The issuer talks to the
# node only through `bpir-cln-rpc-guard` (invoice / listinvoices /
# waitinvoice, bounded parameters); it never opens the node socket.
# [x402]
# guard_socket = "/run/bpir-cln-rpc-guard/rpc.sock"
# # The receiver node's compressed public key; every invoice must be signed by it.
# node_pubkey_hex = "02…"
# network = "mainnet"                 # or "testnet"
# public_url = "https://issuer.bitcoinpir.org"   # request binding + resource.url; clients must call this exact host
# max_timeout_secs = 900              # invoice expiry = maxTimeoutSeconds
# label_prefix = "bpir-x402-"         # must equal the guard's --label-prefix
# clock_skew_secs = 60
# bound_headers = ["content-type"]    # http:1 binding, lowercase ascending
# invoices_per_minute_per_ip = 6
# invoices_per_minute = 60
