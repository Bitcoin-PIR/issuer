[package]
name = "bpir-issuer"
version = "0.1.0"
edition = "2021"
authors = ["Bitcoin PIR contributors"]
description = "BitcoinPIR issuer: sells ARC and Cashu credits for PIR servers (docs/ISSUER_API.md in Bitcoin-PIR/Bitcoin-PIR)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Bitcoin-PIR/issuer"
publish = false

[[bin]]
name = "bpir-issuer"
path = "src/main.rs"

[dependencies]
# Credits contract (gas parameters, /v2/redeem and /v2/info types, signing
# preimages) and the identity certificate a redeeming server presents; the
# same revision the PIR servers build from.
pir-credit = { git = "https://github.com/Bitcoin-PIR/Bitcoin-PIR.git", rev = "1174240b7e5be1f4ac2797ec4169aabcbee04a5b" }
pir-identity = { git = "https://github.com/Bitcoin-PIR/Bitcoin-PIR.git", rev = "1174240b7e5be1f4ac2797ec4169aabcbee04a5b" }
# ARC (anonymous rate-limited credentials, draft-01 over P-256): issuance
# and presentation verification for credits (docs/CREDITS.md).
arc = { git = "https://github.com/Bitcoin-PIR/arc.git", rev = "de6c1709eee0faa32985d5a452be11904ee95de4" }
# Per-epoch ARC issuer keys are derived from one master seed.
hkdf = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
# Verifies server identity certificates and request signatures; signs
# redeem answers.
ed25519-dalek = "2"
# Cashu wallet (token parsing + swap/receive at the mint) and its SQLite store.
cdk = { version = "0.18", default-features = false, features = ["wallet"] }
cdk-sqlite = { version = "0.18", default-features = false, features = ["wallet"] }
# HTTP.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "fs"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
# Serialization and config.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Crypto helpers.
sha2 = "0.10"
hex = "0.4"
getrandom = "0.2"
zeroize = "1"
# BIP39 phrase generation for the mint seed file (`bpir-issuer mnemonic`).
bip39 = { version = "2", default-features = false, features = ["rand", "std"] }
# Operations.
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = "debuginfo"
