[package]
name = "bpir-cln-rpc-guard"
version = "0.1.0"
edition = "2021"
authors = ["Bitcoin PIR contributors"]
description = "Method-and-parameter allowlist in front of the Core Lightning JSON-RPC socket (invoice, listinvoices, waitinvoice only)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Bitcoin-PIR/issuer"
publish = false

[[bin]]
name = "bpir-cln-rpc-guard"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
